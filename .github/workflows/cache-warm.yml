name: Cache Warm

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

jobs:
  cache-warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma schema drift check
        run: |
          pnpm exec prisma migrate diff --exit-code --from-empty --to-schema prisma/schema.prisma || exit 0
      - name: Warm cache (placeholder)
        run: echo "Cache warm step placeholder"
