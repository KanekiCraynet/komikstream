name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - "LICENSE"
  workflow_call:
    inputs:
      skip-security:
        description: "Skip security job (when caller has its own)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== CHECKS (Lint, TypeCheck, Prisma) ====================
  checks:
    name: Lint, TypeCheck & Prisma
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup project
        uses: ./.github/actions/setup
        with:
          prisma-generate: "true"

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript type check
        run: pnpm run typecheck

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Check Prisma schema formatting
        run: |
          pnpm exec prisma format
          if ! git diff --exit-code --quiet prisma/schema.prisma; then
            echo "::error::Prisma schema is not formatted. Run 'pnpm exec prisma format' locally and commit."
            git diff prisma/schema.prisma
            exit 1
          fi
          echo "Prisma schema formatting is correct."

  # ==================== BUILD ====================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [checks]
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup project
        uses: ./.github/actions/setup
        with:
          prisma-generate: "true"
          next-cache: "true"

      - name: Build application
        env:
          DATABASE_URL: "postgresql://dummy:***@localhost:5432/dummy"
          SKIP_DB_CONNECTION: "true"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_dummy"
          CLERK_SECRET_KEY: "sk_test_dummy"
        run: pnpm run build

      - name: Check build output
        run: |
          echo "Build completed successfully!"
          ls -la .next/

      - name: Report bundle size
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| ---- | ---- |" >> $GITHUB_STEP_SUMMARY
          find .next/static/chunks -name "*.js" -type f -exec ls -lh {} \; | awk '{print "| " $NF " | " $5 " |"}' | head -20 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total .next folder size:** $(du -sh .next | cut -f1)" >> $GITHUB_STEP_SUMMARY

  # ==================== SECURITY ====================
  security:
    name: Security Audit
    if: ${{ !inputs.skip-security }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Gitleaks - Check for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # ==================== DEPENDENCY REVIEW (PR only) ====================
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: critical
          comment-summary-in-pr: always
